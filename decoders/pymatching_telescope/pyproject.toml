[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-pymatching-tensor-decoder"
version = "1.0.0"
description = "Separate restored PyMatching tensor-network decoder reference"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "stim>=1.13,<2",
    "pymatching==2.4.0",
]

[project.optional-dependencies]
fpga = ["pyserial>=3.5,<4"]

[project.scripts]
pymatching-telescope = "pymatching_tensor_decoder.telescope.decoder:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymatching_tensor_decoder*"]
namespaces = false

[tool.setuptools.package-data]
pymatching_tensor_decoder = [
    "native/*.c",
    "native/*.cc",
    "native/*.cu",
    "native/*.cuh",
    "native/prebuilt/windows/*",
    "native/vendor/pymatching_2_4_0/LICENSE",
    "native/vendor/pymatching_2_4_0/README.md",
    "native/vendor/pymatching_2_4_0/ORIGIN.json",
    "native/vendor/pymatching_2_4_0/src/**/*.h",
    "native/vendor/pymatching_2_4_0/src/**/*.inl",
    "native/vendor/pymatching_2_4_0/src/**/*.cc",
    "telescope/profiles/*.json",
    "telescope/tools/*.cpp",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
