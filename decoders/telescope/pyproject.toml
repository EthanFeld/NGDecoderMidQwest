[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-tensor-decoder"
version = "1.0.0"
description = "Distance-15 telescope decoder with in-repository correlated matching"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "stim>=1.13,<2", "pyserial>=3.5,<4"]

[project.optional-dependencies]
reference = ["pymatching==2.4.0"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "pymatching==2.4.0"]

[tool.setuptools.packages.find]
where = ["tensor_decoder/src"]
include = ["tensor_decoder*"]

[tool.setuptools.package-data]
tensor_decoder = ["native/*.c", "native/*.cc", "native/*.cu", "native/*.cuh", "native/prebuilt/windows/*", "native/vendor/pymatching_2_4_0/LICENSE", "native/vendor/pymatching_2_4_0/README.md", "native/vendor/pymatching_2_4_0/ORIGIN.json", "native/vendor/pymatching_2_4_0/src/**/*.h", "native/vendor/pymatching_2_4_0/src/**/*.inl", "native/vendor/pymatching_2_4_0/src/**/*.cc"]

[tool.pytest.ini_options]
testpaths = ["tests", "tensor_decoder/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
