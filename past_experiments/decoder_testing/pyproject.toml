[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngdecoder-bench"
version = "0.1.0"
description = "Packed, reproducible surface-code decoder distance sweeps"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "stim>=1.13,<2", "pymatching>=2.2,<3"]

[project.optional-dependencies]
scalable = ["pymatching>=2.3,<3"]
ibm-relay = ["relay-bp @ git+https://github.com/trmue/relay.git@72341ef85cd45779e6483c338aef7ba85094eac1"]
plot = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
qecbench = "qecbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
